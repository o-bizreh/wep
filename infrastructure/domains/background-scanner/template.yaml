AWSTemplateFormatVersion: '2010-09-09'
Description: WEP Background Scanner - ECS Fargate Scheduled Task

Parameters:
  Environment:
    Type: String
    Default: development
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  EcrImageUri:
    Type: String
    Description: ECR image URI for the scanner container
  GithubOrg:
    Type: String
    Default: washmen
  GithubTokenSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the GitHub token

Resources:

  ScannerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub wep-scanner-${Environment}
      Tags:
        - Key: Platform
          Value: WEP
        - Key: Module
          Value: background-scanner
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: DevOps

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GithubTokenSecretArn
      Tags:
        - Key: Platform
          Value: WEP
        - Key: Module
          Value: background-scanner
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: DevOps

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScannerPermissions
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wep-*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wep-*/index/*
              - Effect: Allow
                Action:
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/wep-platform-${Environment}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wep/*
      Tags:
        - Key: Platform
          Value: WEP
        - Key: Module
          Value: background-scanner
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: DevOps

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /wep/ecs-scanner/${Environment}
      RetentionInDays: 30

  ScannerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: LogGroup
    Properties:
      Family: !Sub wep-background-scanner-${Environment}
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: scanner
          Image: !Ref EcrImageUri
          Essential: true
          Environment:
            - Name: WEP_ENVIRONMENT
              Value: !Ref Environment
            - Name: GITHUB_ORG
              Value: !Ref GithubOrg
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: GITHUB_TOKEN
              ValueFrom: !Ref GithubTokenSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /wep/ecs-scanner/${Environment}
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scanner
      Tags:
        - Key: Platform
          Value: WEP
        - Key: Module
          Value: background-scanner
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: DevOps

  EventBridgeInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunEcsTask
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref ScannerTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
      Tags:
        - Key: Platform
          Value: WEP
        - Key: Module
          Value: background-scanner
        - Key: Environment
          Value: !Ref Environment
        - Key: CostCenter
          Value: DevOps

  NightlyScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub wep-nightly-scanner-${Environment}
      Description: Triggers the WEP background scanner at midnight UTC
      ScheduleExpression: cron(0 0 * * ? *)
      State: ENABLED
      Targets:
        - Id: ScannerTask
          Arn: !GetAtt ScannerCluster.Arn
          RoleArn: !GetAtt EventBridgeInvokeRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref ScannerTaskDefinition
            TaskCount: 1
            LaunchType: FARGATE
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: !Ref SubnetIds
                SecurityGroups: []

Outputs:
  ScannerClusterArn:
    Description: ARN of the ECS scanner cluster
    Value: !GetAtt ScannerCluster.Arn
    Export:
      Name: !Sub wep-scanner-cluster-arn-${Environment}

  ScannerTaskDefinitionArn:
    Description: ARN of the scanner task definition
    Value: !Ref ScannerTaskDefinition
    Export:
      Name: !Sub wep-scanner-task-def-arn-${Environment}

  LogGroupName:
    Description: CloudWatch log group for the scanner
    Value: !Ref LogGroup
    Export:
      Name: !Sub wep-scanner-log-group-${Environment}
