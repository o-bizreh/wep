name: Deploy Alert Evaluator Lambda

on:
  push:
    branches: [main]
    paths:
      - 'lambdas/alert-evaluator/**'
      - '.github/workflows/deploy-lambda-alert-evaluator.yml'

env:
  AWS_REGION: me-south-1
  LAMBDA_FUNCTION_NAME: wep-alert-evaluator

jobs:
  deploy:
    name: Build & Deploy Lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: lambdas/alert-evaluator
        run: npm install

      - name: Build
        working-directory: lambdas/alert-evaluator
        run: npm run build

      - name: Package
        working-directory: lambdas/alert-evaluator
        run: |
          cp -r node_modules dist/
          cd dist && zip -r ../function.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        working-directory: lambdas/alert-evaluator
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
